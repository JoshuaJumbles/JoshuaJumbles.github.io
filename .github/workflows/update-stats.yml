name: Update GitHub stats

on:
  schedule:
    # ~daily, offset from the hour to avoid the GitHub Actions cron rush
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and write assets/stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          if git diff --cached --quiet; then
            echo "No stats change today."
          else
            git commit -m "chore: refresh GitHub stats"
            git push
          fi
